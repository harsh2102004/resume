name: PulseCast CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test Pipeline
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Backend Dependencies
        run: npm ci

      - name: Lint Backend
        run: npm run lint

      - name: Run Backend Tests with Coverage
        env:
          STREAM_SECRET: "ci_test_stream_secret_2026"
          ACCESS_TOKEN_SECRET: "ci_test_access_token_secret_2026"
          REFRESH_TOKEN_SECRET: "ci_test_refresh_token_secret_2026"
          CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
        run: npm run test:coverage

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: docker build -t pulsecast-backend:ci .
